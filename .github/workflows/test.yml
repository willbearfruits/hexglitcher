name: Tests

on:
  push:
    branches: [v3, master]
  pull_request:

jobs:
  engine-tests:
    name: Engine tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow opencv-python-headless pytest
      - name: Run engine test suite
        run: PYTHONPATH=src python -m pytest tests/test_v3.py -q
      - name: Compile check
        run: python -m compileall -q src
